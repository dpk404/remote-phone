name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |-
          printf 'storeFile=app/release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        # Named after the app's own version, not the tag: a desktop-only release ships the unchanged APK honestly
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)
          cp android/app/build/outputs/apk/release/app-release.apk RemotePhone-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: RemotePhone-*.apk

  bundle-client:
    name: Bundle Linux Client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create client tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          tar -czf RemotePhone-linux-${VERSION}.tar.gz \
            --transform "s|^|RemotePhone-linux-${VERSION}/|" \
            run.sh pyproject.toml README.md LICENSE remotephone/

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-client
          path: RemotePhone-linux-*.tar.gz

  build-mac:
    name: Build macOS Client
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build app and DMG
        run: |
          pip install -e . pyinstaller
          tools/build_mac.sh

      - name: Upload macOS client artifact
        uses: actions/upload-artifact@v7
        with:
          name: mac-client
          path: dist/RemotePhone-*.dmg

  create-release:
    name: Create GitHub Release
    needs: [build-apk, bundle-client, build-mac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: apk

      - name: Download Linux client
        uses: actions/download-artifact@v8
        with:
          name: linux-client

      - name: Download macOS client
        uses: actions/download-artifact@v8
        with:
          name: mac-client

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          gh release create "v${VERSION}" \
            --title "RemotePhone v${VERSION}" \
            --generate-notes \
            RemotePhone-*.apk \
            RemotePhone-linux-${VERSION}.tar.gz \
            RemotePhone-*.dmg
